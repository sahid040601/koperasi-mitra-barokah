name: Build APK Catatan Ceklis Suara

on:
  push:
    branches: [ "main", "android-catatan-ceklis-build" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: catatan-ceklis-suara
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Ceklis-Suara-APK
          path: catatan-ceklis-suara/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
