services:
  - type: web
    name: koperasi-mitra-barokah
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://koperasi-mitra-barokah.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_MANAJER_PASSWORD
        sync: false
      - key: INITIAL_PENGAWAS_PASSWORD
        sync: false
      - key: INITIAL_NASABAH_PASSWORD
        sync: false
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
