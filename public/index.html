<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Koperasi Mitra Barokah • Sistem Koperasi & Kasir</title>
<meta name="description" content="Sistem informasi manajemen Koperasi Mitra Barokah" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
.kmb-logo-img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit}.logo-wrap{background:#fff;border:4px solid #f6c945;border-radius:999px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
<script>
(function(){
  function patchLogos(){
    document.querySelectorAll('#root *').forEach(function(el){
      if(el.children.length===0 && el.textContent.trim()==='MB' && !el.dataset.logoPatched){
        el.dataset.logoPatched='1';
        el.innerHTML='<img class="kmb-logo-img" src="/logo.svg" alt="Logo Koperasi Mitra Barokah">';
        el.classList.add('logo-wrap');
      }
    });
  }
  new MutationObserver(patchLogos).observe(document.getElementById('root'),{childList:true,subtree:true});
  patchLogos();
})();
</script>
</body>
</html>
