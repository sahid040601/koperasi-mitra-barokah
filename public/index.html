*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8f7;color:#10231b}button,input,select,textarea{font:inherit}::selection{background:#b8e7cd}.kmb-shell{background:linear-gradient(135deg,#f8fbf9 0%,#f3f7f5 100%)}.kmb-card{background:#fff;border:1px solid #e5ece8;border-radius:18px;box-shadow:0 8px 28px rgba(14,61,40,.055)}.kmb-sidebar{background:linear-gradient(180deg,#075b39 0%,#03462d 100%)}.kmb-nav-active{background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.08));box-shadow:inset 3px 0 0 #f6c945}.pos-product{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.pos-product:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,72,44,.1);border-color:#77bd9b}.soft-ring:focus{outline:none;box-shadow:0 0 0 4px rgba(16,185,129,.12);border-color:#159a62}
